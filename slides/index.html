<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Facility Maintenance System - Presentation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Fullscreen Slide Canvas */
    .slide-canvas {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 800px;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: center;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .slide.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Slide 2 Minimalist Folder Layout & Vector Animations */
    .folders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 44px;
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    .folder-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .folder-heading {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 24px;
      text-transform: lowercase;
    }

    .folder-graphic {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes floatSlowReverse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes dashFlowReverse {
      to { stroke-dashoffset: 40; }
    }

    @keyframes pulseSubtle {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5)); }
    }

    @keyframes scalePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes pipePulse {
      0%, 100% { opacity: 0.45; stroke: #38bdf8; }
      50% { opacity: 1; stroke: #67e8f9; filter: drop-shadow(0 0 5px #38bdf8); }
    }

    @keyframes popHead {
      0%, 100% { transform: translate(155px, 28px) scale(1); }
      50% { transform: translate(163px, 28px) scale(1.08); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7)); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }

    @keyframes scalePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes travelScan {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(80px); opacity: 0; }
    }

    .anim-float { animation: floatSlow 4s ease-in-out infinite; }
    .anim-float-reverse { animation: floatSlowReverse 4s ease-in-out infinite; }
    .anim-pulse-subtle { animation: pulseSubtle 3s ease-in-out infinite; }
    .anim-pop-head { animation: popHead 2s ease-in-out infinite; }
    .anim-pipe-pulse { animation: pipePulse 1.8s ease-in-out infinite; }
    .anim-spin { animation: spinSlow 12s linear infinite; transform-origin: center; }
    .anim-glow { animation: glowPulse 2.5s ease-in-out infinite; }
    .anim-scale {
      transform-box: fill-box;
      transform-origin: center;
      animation: scalePulse 2.5s ease-in-out infinite;
    }
    .anim-scan { animation: travelScan 2.5s ease-in-out infinite; }
    .dash-flow-fast { animation: dashFlow 1.4s linear infinite; }
    .dash-flow-reverse { animation: dashFlowReverse 1.4s linear infinite; }

    .slide-header-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: lowercase;
      text-align: center;
    }

    .slide-svg-wrap {
      width: 100%;
      max-width: 1050px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Minimalist Typography */
    .kicker {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .main-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 400;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 48px;
      max-width: 850px;
    }

    /* Custom Positioning & Column Layouts (No Cards) */
    .cols-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 50px;
    }

    .cols-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .cols-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 36px;
    }

    .col {
      display: flex;
      flex-direction: column;
    }

    .section-label {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #818cf8;
      margin-bottom: 6px;
    }

    .section-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bullet-list li {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.5;
      position: relative;
      padding-left: 18px;
    }

    .bullet-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: #38bdf8;
      font-weight: bold;
    }

    .bullet-list li strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Typographic Flow & Arrows */
    .flow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .flow-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .flow-node-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .flow-node-sub {
      font-size: 0.8rem;
      color: #38bdf8;
      margin-top: 4px;
    }

    .flow-arrow {
      font-size: 1.5rem;
      color: #64748b;
      font-weight: 300;
    }

    /* Horizontal Steps */
    .steps-row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .step-item {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .step-index {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 12px;
    }

    .step-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .step-role {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #818cf8;
      margin-bottom: 8px;
    }

    .step-body {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Faint slide indicator */
    .slide-indicator {
      position: fixed;
      bottom: 24px;
      right: 32px;
      font-size: 0.85rem;
      font-family: monospace;
      color: #475569;
      letter-spacing: 0.05em;
    }

    /* Print Setup */
    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .slide-canvas {
        max-width: none;
        max-height: none;
        padding: 40px;
      }
      .slide {
        display: flex !important;
        page-break-after: always;
        height: 100vh;
      }
      .slide-indicator {
        display: none;
      }
      .main-title, .section-label, .step-header, .bullet-list li strong {
        color: #0f172a !important;
      }
      .subtitle, .section-desc, .step-body, .bullet-list li {
        color: #475569 !important;
      }
    }
  </style>
</head>

  <!-- Faint, minimal slide indicator -->
  <div class="slide-indicator" id="slideIndicator">01 / 09</div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    let currentSlide = 0;
    const indicator = document.getElementById('slideIndicator');

    function showSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      slides[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');

      const padCurrent = String(currentSlide + 1).padStart(2, '0');
      const padTotal = String(totalSlides).padStart(2, '0');
      indicator.textContent = `${padCurrent} / ${padTotal}`;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide > 0) showSlide(currentSlide - 1);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'Backspace':
        case 'PageUp':
          e.preventDefault();
          prevSlide();
          break;
        case 'Home':
          e.preventDefault();
          showSlide(0);
          break;
        case 'End':
          e.preventDefault();
          showSlide(totalSlides - 1);
          break;
        case 'f':
        case 'F':
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
          break;
      }
    });

    // Click anywhere on right half to advance, left half to go back
    document.addEventListener('click', (e) => {
      if (e.clientX > window.innerWidth / 2) {
        nextSlide();
      } else {
        prevSlide();
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const paramSlide = parseInt(urlParams.get('slide') || '0', 10);
    const initialSlide = (paramSlide > 0 && paramSlide <= totalSlides) ? paramSlide - 1 : 0;
    showSlide(initialSlide);
  </script>
</body>
</html>
